  <script>
    // Aplica el tema guardado antes del primer paint para evitar el destello claro.
    // Clave y formato deben coincidir con ThemeService ('theme-preference', JSON booleano).
    (function () {
      try {
        if (JSON.parse(localStorage.getItem('theme-preference') || 'false') === true) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        /* preferencia corrupta o almacenamiento bloqueado: se usa el tema claro */
      }
    })();
  </script>
