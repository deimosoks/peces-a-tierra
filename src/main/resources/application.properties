spring.application.name=Peces a tierra

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.default_batch_fetch_size=50
#
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Datasource de solo lectura para el endpoint de IA (rol peces_ai_readonly)
ai.datasource.url=${AI_DB_URL:${DB_URL}}
ai.datasource.username=${AI_DB_USER}
ai.datasource.password=${AI_DB_PASS}
ai.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

server.port=${PORT:8080}

# CORS: origenes explicitos permitidos, separados por comas. Vacio = sin CORS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Limite de peticiones en memoria (H-18): intentos de login y consultas al
# asistente por ventana, por IP+usuario en el login y por usuario en la IA.
security.rate-limit.login-max=${RATE_LIMIT_LOGIN_MAX:10}
security.rate-limit.ai-max=${RATE_LIMIT_AI_MAX:20}
security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}
# Gemini Configuration
google.gemini.api.key=${GEMINI_API_KEY}
google.gemini.model.id=gemini-3.1-flash-lite-preview

