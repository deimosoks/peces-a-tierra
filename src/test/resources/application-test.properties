# Perfil de test: valores literales, sin secretos reales ni dependencia del entorno.
# spring.datasource.* lo sustituye @ServiceConnection cuando Testcontainers arranca.
# ai.datasource.* son un fallback documentado: AbstractIntegrationTest los
# sobrescribe con @DynamicPropertySource para apuntar al mismo contenedor (M-11).
spring.datasource.url=jdbc:postgresql://localhost:5432/peces_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver
ai.datasource.url=jdbc:postgresql://localhost:5432/peces_test
ai.datasource.username=test
ai.datasource.password=test
ai.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

jwt.secret=test-secret-0123456789-0123456789-0123456789

# H-18: los tests no deben chocar con el limitador de peticiones; las pruebas
# del propio limitador fijan sus valores con @TestPropertySource o construyen
# el filtro a mano.
security.rate-limit.login-max=1000
security.rate-limit.ai-max=1000
security.rate-limit.window-seconds=60

cloudinary.cloud.name=test-cloud
cloudinary.api.key=test-key
cloudinary.api.secret=test-secret

google.gemini.api.key=test-gemini-key
google.gemini.model.id=test-model

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
